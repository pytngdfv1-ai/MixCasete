<style>

  .top-grille { position: absolute; top: 7px; left: 50%; transform: translateX(-50%); width: 86%; height: 13px;

  .album-square:active { transform: scale(0.99); }

  .cassette-window {

  .corner-screw::after { content: ''; position: absolute; top: 50%; left: 50%; width: 10px; height: 2px; background: #3d3d3d; border-radius: 1px; box-shadow: 0 1px 0 rgba(255,255,255,0.6); }

  .cs-bl { bottom: 7px; left: 7px; }.cs-bl::after { transform: translate(-50%,-50%) rotate(80deg); }
  .cs-br { bottom: 7px; right: 7px;}.cs-br::after { transform: translate(-50%,-50%) rotate(12deg); }

  .source-strip {

  .bottom-bar {

  .search-overlay, .playlist-overlay {

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="ringGrad" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>

      <stop offset="85%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#bfbfbf"/>
    </radialGradient>
    <radialGradient id="hubGrad" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#6a6a6a"/>
      <stop offset="35%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <g id="reelShape">
      <circle cx="50" cy="50" r="49" fill="url(#ringGrad)"/>
      <g fill="#141414">
        <rect x="45" y="5" width="10" height="15" rx="2"/>

        <rect x="45" y="5" width="10" height="15" rx="2" transform="rotate(300 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="27" fill="url(#hubGrad)"/>
      <circle cx="50" cy="50" r="6" fill="#0a0a0a"/>
    </g>
  </defs>
</svg>

  <div class="cassette-window">
    <div class="corner-screw cs-tl"></div>

      <div class="cassette-body">
        <div class="cassette-content">
          <div class="side-label-a">A</div>
          <div class="reel-capsule">
            <svg class="reel" id="reelLeft" viewBox="0 0 100 100"><use href="#reelShape"/></svg>

              <div class="tape-pack-left" id="tapePack"></div>
              <div class="tape-pad-right"></div>
            </div>

          </div>
          <div style="text-align:right;color:#141414;font-weight:700;">
            <div style="font-size:25px;">60</div>
            <div style="font-size:11px;letter-spacing:0.5px;">MIN.</div>
          </div>
        </div>

          <div class="brand-dot"></div>
          <div class="cassette-brand" id="artistBrand">@Mix.Casete</div>
        </div>

      <div class="cassette-lower">
        <div class="lower-hole"></div>
        <div class="lower-hole square"></div>
        <div class="lower-screw"></div>
        <div class="lower-hole square"></div>
        <div class="lower-hole"></div>

  </div>

  <div class="source-strip">
    <div class="source-btn" id="srcYT">▶ YouTube <span class="led" id="ledYT"></span></div>
    <div class="source-btn" id="srcLocal">📁 Local <span class="led" id="ledLocal"></span></div>
    <div class="source-btn" id="srcUpload">⬆ Subir</div>
  </div>

  <div class="buttons-area">
    <div class="button-labels">
      <div class="button-label">RECORD</div>
      <div class="button-label">PLAY</div>
      <div class="button-label">REW</div>
      <div class="button-label">F.F</div>
      <div class="button-label">STOP</div>
      <div class="button-label">PAUSE</div>
    </div>
    <div class="button-row-main">
      <button class="piano-btn" data-action="record"><span class="btn-icon">●</span></button>
      <button class="piano-btn" data-action="play"><span class="btn-icon">▶</span></button>
      <button class="piano-btn" data-action="rew"><span class="btn-icon">◀</span></button>
      <button class="piano-btn" data-action="ff"><span class="btn-icon">▶▶</span></button>
      <button class="piano-btn" data-action="stop"><span class="btn-icon">■</span></button>
      <button class="piano-btn" data-action="pause"><span class="btn-icon">❚</span></button>
    </div>
  </div>

  <div class="bottom-bar" id="plOpen">
    <span class="pl-rec-dot" id="plRecDot"></span>
    <span id="plBarText">📼 PLAYLIST · 0 TEMAS</span>
    <span class="pl-count" id="plCount">0</span>
  </div>
</div>

<input type="file" id="filePicker" accept="audio/*" style="display:none">

<div class="search-overlay" id="searchOverlay">
  <div class="search-panel">
    <div class="panel-handle"></div>
    <div class="panel-title">▶ BUSCAR EN YOUTUBE</div>
    <div class="search-row">
      <input class="search-input" id="searchInput" placeholder="Canción o artista...">
      <button class="search-go" id="searchGo">OK</button>
    </div>
    <div class="url-divider">— O PEGA UN ENLACE —</div>
    <div class="url-row">
      <input class="search-input" id="urlInput" placeholder="https://youtube.com/watch?v=...">
      <button class="search-go" id="urlGo">▶</button>
    </div>
    <div class="results-list" id="resultsList">
      <div class="result-meta" style="text-align:center;padding:20px;">Escribe algo y pulsa OK 🎵</div>
    </div>
  </div>
</div>

<div class="playlist-overlay" id="plOverlay">
  <div class="playlist-panel">
    <div class="panel-handle"></div>
    <div class="panel-title">🎙️ MI PLAYLIST</div>
    <div class="pl-list" id="plList"></div>
    <div class="pl-footer">
      <button class="pl-clear" id="plClear">🗑 VACIAR PLAYLIST</button>
    </div>
  </div>
</div>

<!-- YouTube IFrame API oficial (legal, respeta ToS) -->
<div id="ytMount"></div>
<audio id="audioLocal" style="display:none"></audio>

<script>
/* ============ TOAST ============ */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg, ms = 2500) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}

/* ============ ESTADO ============ */
const HAS_BRIDGE = typeof Android !== 'undefined';
const PL_KEY = 'mixcasete_playlist_legal_v2';
let playlist = [];
try { playlist = JSON.parse(localStorage.getItem(PL_KEY)) || []; } catch (e) { playlist = []; }

let current = { id: null, title: '', author: '', thumb: '', type: null }; // type: 'yt' | 'local'
let mode = 'none';   // 'yt' | 'local' | 'none'
let ytPlayer = null, ytReady = false, ytQueue = null;

const reelL = document.getElementById('reelLeft');
const reelR = document.getElementById('reelRight');
const tapePack = document.getElementById('tapePack');
const titleEl = document.getElementById('trackTitle');
const albumImg = document.getElementById('albumImg');
const artistBrand = document.getElementById('artistBrand');
const ledYT = document.getElementById('ledYT');
const ledLocal = document.getElementById('ledLocal');
const audioLocal = document.getElementById('audioLocal');

/* ============ UI HELPERS ============ */
function setReels(on) {
  reelL.classList.toggle('playing', on);
  reelR.classList.toggle('playing', on);
}
function setLed(t) {
  ledYT.className = 'led' + (t === 'yt' ? ' yt' : '');
  ledLocal.className = 'led' + (t === 'local' ? ' local' : '');
}
function setArtist(a) {
  artistBrand.textContent = a || '@Mix.Casete';
}
function setTitle(t) {
  titleEl.textContent = t;
}
function setCover(url) {
  if (url) albumImg.src = url;
}

/* ============ PLAYLIST ============ */
function savePL() {
  // Al guardar, no guardamos blob URLs (no persisten entre sesiones)
  const toSave = playlist.map(t => {
    const { blobUrl, ...rest } = t;
    return rest;
  });
  localStorage.setItem(PL_KEY, JSON.stringify(toSave));
  updatePlBar();
  renderPL();
}
function updatePlBar() {
  document.getElementById('plBarText').textContent =
    '📼 PLAYLIST · ' + playlist.length + (playlist.length === 1 ? ' TEMA' : ' TEMAS');
  document.getElementById('plCount').textContent = playlist.length;
}
function renderPL() {
  const list = document.getElementById('plList');
  if (!playlist.length) {
    list.innerHTML = '<div class="result-meta" style="text-align:center;padding:20px;line-height:1.6;">Playlist vacía.<br>📁 Sube tus mp3 propios<br>o ▶ agrega de YouTube</div>';
    return;
  }
  list.innerHTML = '';
  playlist.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'pl-item' + (t.id === current.id ? ' current' : '');
    const icon = t.type === 'local' ? '📁 ' : '▶ ';
    div.innerHTML =
      '<img src="' + (t.thumb || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect fill="%23171412" width="40" height="40"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="%23c9b999" font-size="16">' + (t.type === 'local' ? '📁' : '🎵') + '</text></svg>') + '">' +
      '<div class="pl-info">' +
        '<div class="pl-title">' + icon + t.title + (t.local ? ' 💾' : '') + '</div>' +
        '<div class="pl-author">' + (t.author || 'Archivo local') + '</div>' +
      '</div>' +
      '<div class="pl-actions">' +
        '<button class="pl-btn play" data-act="play" data-i="' + i + '">▶</button>' +
        '<button class="pl-btn" data-act="up" data-i="' + i + '">▲</button>' +
        '<button class="pl-btn" data-act="down" data-i="' + i + '">▼</button>' +
        '<button class="pl-btn del" data-act="del" data-i="' + i + '">✕</button>' +
      '</div>';
    list.appendChild(div);
  });
}
document.getElementById('plList').addEventListener('click', e => {
  const btn = e.target.closest('.pl-btn');
  if (!btn) return;
  const i = +btn.dataset.i, act = btn.dataset.act;
  if (act === 'play') { playItem(playlist[i]); closePL(); }
  else if (act === 'up' && i > 0) { [playlist[i - 1], playlist[i]] = [playlist[i], playlist[i - 1]]; savePL(); }
  else if (act === 'down' && i < playlist.length - 1) { [playlist[i + 1], playlist[i]] = [playlist[i], playlist[i + 1]]; savePL(); }
  else if (act === 'del') {
    const t = playlist[i];
    if (t.local && HAS_BRIDGE) { try { Android.deleteLocal(t.id); } catch (e) {} }
    playlist.splice(i, 1);
    savePL();
  }
});
document.getElementById('plClear').onclick = () => {
  if (playlist.length && confirm('¿Vaciar toda la playlist?')) {
    playlist.forEach(t => { if (t.local && HAS_BRIDGE) try { Android.deleteLocal(t.id); } catch (e) {} });
    playlist = [];
    savePL();
  }
};
const plOverlay = document.getElementById('plOverlay');
document.getElementById('plOpen').onclick = () => { renderPL(); plOverlay.classList.add('open'); };
plOverlay.onclick = e => { if (e.target === plOverlay) plOverlay.classList.remove('open'); };
function closePL() { plOverlay.classList.remove('open'); }

/* ============ YOUTUBE IFRAME API OFICIAL ============ */
function loadYTAPI() {
  if (window.YT && window.YT.Player) return;
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}
window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('ytMount', {
    width: '1', height: '1',
    playerVars: { autoplay: 0, controls: 0, playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => {
        ytReady = true;
        if (ytQueue) { ytQueue(); ytQueue = null; }
      },
      onStateChange: ev => {
        if (mode !== 'yt') return;
        const p = ev.data;
        if (p === YT.PlayerState.PLAYING) setReels(true);
        else if (p === YT.PlayerState.PAUSED) setReels(false);
        else if (p === YT.PlayerState.ENDED) { setReels(false); autoNext(); }
      }
    }
  });
};

function ensureYT(cb) {
  loadYTAPI();
  if (ytReady && ytPlayer) { cb(); return; }
  ytQueue = cb;
}

/* ============ PLAY ITEM ============ */
function playItem(item) {
  current = item;
  setTitle(item.title);
  setArtist(item.author || '');
  setCover(item.thumb);
  renderPL();

  if (item.type === 'yt') {
    mode = 'yt'; setLed('yt');
    // Detener audio local si estaba sonando
    audioLocal.pause(); audioLocal.src = '';
    ensureYT(() => {
      ytPlayer.loadVideoById(item.id);
    });
  } else if (item.type === 'local') {
    mode = 'local'; setLed('local');
    // Detener YouTube si estaba sonando
    if (ytReady && ytPlayer) ytPlayer.stopVideo();
    // Si tiene blobUrl activa, úsala; si no, pide a Java la ruta del archivo
    if (item.blobUrl) {
      audioLocal.src = item.blobUrl;
      audioLocal.play();
    } else if (item.local && HAS_BRIDGE) {
      // Lee el archivo desde almacenamiento privado de la app
      try {
        // En Android, construimos URL file:// a partir de la ruta
        audioLocal.src = 'file://' + item.local;
        audioLocal.play();
      } catch (e) { toast('⚠ No se pudo leer el archivo'); }
    } else {
      toast('⚠ Archivo local no disponible');
    }
  }
}

audioLocal.addEventListener('play', () => setReels(true));
audioLocal.addEventListener('pause', () => setReels(false));
audioLocal.addEventListener('ended', autoNext);
audioLocal.addEventListener('error', () => { toast('⚠ Error al reproducir archivo'); });

function autoNext() {
  const idx = playlist.findIndex(t => t.id === current.id);
  if (idx > -1 && idx < playlist.length - 1) playItem(playlist[idx + 1]);
  else { setLed('none'); setTitle('⏹ Fin de la cinta'); setReels(false); }
}

/* ============ CONTROLES ============ */
function doPlay() {
  if (mode === 'yt' && ytReady) ytPlayer.playVideo();
  else if (mode === 'local') audioLocal.play();
}
function doPause() {
  if (mode === 'yt' && ytReady) ytPlayer.pauseVideo();
  else if (mode === 'local') audioLocal.pause();
}
function doStop() {
  if (mode === 'yt' && ytReady) ytPlayer.stopVideo();
  else if (mode === 'local') { audioLocal.pause(); audioLocal.currentTime = 0; }
  setReels(false);
}
function doSeek(delta) {
  if (mode === 'yt' && ytReady && ytPlayer.getCurrentTime) {
    ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() + delta), true);
  } else if (mode === 'local' && isFinite(audioLocal.duration)) {
    audioLocal.currentTime = Math.max(0, Math.min(audioLocal.duration, audioLocal.currentTime + delta));
  }
}

document.querySelectorAll('.piano-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.piano-btn').forEach(b => b.classList.remove('active'));
    const a = btn.dataset.action;
    if (a === 'record') { recToPlaylist(); return; }
    if (a === 'play') { btn.classList.add('active'); doPlay(); }
    else if (a === 'pause') { btn.classList.add('active'); doPause(); }
    else if (a === 'stop') { btn.classList.add('active'); doStop(); }
    else if (a === 'rew') { doSeek(-10); }
    else if (a === 'ff') { doSeek(10); }
    if (navigator.vibrate) navigator.vibrate(25);
  });
});

/* ============ RECORD (agrega a playlist) ============ */
function recToPlaylist() {
  const dot = document.getElementById('plRecDot');
  if (!current.id) { toast('⚠ Nada sonando para grabar'); return; }
  if (playlist.some(t => t.id === current.id)) {
    dot.classList.add('on'); setTimeout(() => dot.classList.remove('on'), 900);
    toast('● Ya está en la playlist'); return;
  }
  // Clonar sin blobUrl para persistencia; para 'local' se guarda la referencia al archivo
  const item = { id: current.id, title: current.title, author: current.author,
                 thumb: current.thumb, type: current.type, local: current.local };
  playlist.push(item);
  savePL();
  dot.classList.add('on'); setTimeout(() => dot.classList.remove('on'), 1400);
  toast('● REC → tema agregado ✔');
  if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
}

/* ============ BÚSQUEDA YOUTUBE (legal, vía noembed para metadatos) ============ */
const searchOverlay = document.getElementById('searchOverlay');
document.getElementById('srcYT').onclick = () => searchOverlay.classList.add('open');
searchOverlay.onclick = e => { if (e.target === searchOverlay) searchOverlay.classList.remove('open'); };
function closeSearch() { searchOverlay.classList.remove('open'); }

function extractVideoId(str) {
  str = (str || '').trim();
  if (/^[\w-]{11}$/.test(str)) return str;
  const m = str.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  return m ? m[1] : null;
}

async function fetchMeta(id) {
  try {
    const r = await fetch('https://noembed.com/embed?url=' +
      encodeURIComponent('https://www.youtube.com/watch?v=' + id));
    const j = await r.json();
    return {
      title: j.title || 'YouTube · ' + id,
      author: j.author_name || 'YouTube',
      thumb: j.thumbnail_url || ('https://i.ytimg.com/vi/' + id + '/hqdefault.jpg')
    };
  } catch (e) {
    return {
      title: 'YouTube · ' + id, author: 'YouTube',
      thumb: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'
    };
  }
}

document.getElementById('urlGo').onclick = async () => {
  const id = extractVideoId(document.getElementById('urlInput').value);
  if (!id) { toast('⚠ Enlace no válido'); return; }
  closeSearch();
  toast('⏳ Cargando metadatos...');
  const meta = await fetchMeta(id);
  playItem({ id, type: 'yt', ...meta });
};
document.getElementById('urlInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('urlGo').click();
});

/* Búsqueda simple (sin scraping): usa el término para abrir YouTube search en la misma pestaña overlay
   Pero para mantenerlo simple y legal, solo aceptamos URL o ID directo */
document.getElementById('searchGo').onclick = async () => {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  // Si parece un ID o URL, lo tratamos como tal
  const id = extractVideoId(q);
  if (id) {
    closeSearch();
    const meta = await fetchMeta(id);
    playItem({ id, type: 'yt', ...meta });
    return;
  }
  // Si no, mostramos link externo para que el usuario copie un ID real (cumple ToS)
  const list = document.getElementById('resultsList');
  list.innerHTML =
    '<div class="result-meta" style="text-align:center;padding:20px;line-height:1.8;">' +
    'Para respetar los ToS de YouTube,<br>pega el enlace o ID de un video<br>' +
    'en el campo de abajo<br><br>' +
    '<a href="https://www.youtube.com/results?search_query=' + encodeURIComponent(q) +
    '" target="_blank" style="color:#f0872c;font-weight:800;">Abrir YouTube ↗</a><br>' +
    '<small>(busca y copia el link del video)</small>' +
    '</div>';
};
document.getElementById('searchInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('searchGo').click();
});

/* ============ SUBIR ARCHIVO LOCAL (legal: solo archivos del usuario) ============ */
const filePicker = document.getElementById('filePicker');
document.getElementById('srcUpload').onclick = () => filePicker.click();
document.getElementById('srcLocal').onclick = () => {
  if (!playlist.some(t => t.type === 'local')) {
    toast('📁 Aún no has subido archivos locales');
    return;
  }
  toast('📁 Toca un tema en la playlist');
  plOverlay.classList.add('open');
};

filePicker.addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  filePicker.value = ''; // reset

  const id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  const title = file.name.replace(/\.[^.]+$/, '');
  const blobUrl = URL.createObjectURL(file);

  const item = {
    id, type: 'local',
    title, author: 'Archivo local',
    thumb: null, blobUrl, local: null
  };

  // Guarda en almacenamiento privado de la app (vía Java)
  if (HAS_BRIDGE) {
    toast('⏬ Guardando archivo en el teléfono...');
    try { Android.saveLocalFile(blobUrl, id); }
    catch (e) { toast('⚠ No se pudo guardar'); }
  }

  playlist.push(item);
  savePL();
  playItem(item);
  toast('✔ Agregado a la playlist');
});

/* Callback cuando Java terminó de guardar */
window.onLocalSaved = function (id, path) {
  const item = playlist.find(t => t.id === id);
  if (item && path) {
    item.local = path;
    savePL();
    toast('💾 Archivo guardado en el teléfono');
  }
};

/* ============ RESTAURAR archivos locales al iniciar ============ */
window.addEventListener('load', () => {
  // Para cada tema 'local' guardado, reconstruye blobUrl leyendo el archivo
  playlist.forEach(item => {
    if (item.type === 'local' && item.local && HAS_BRIDGE) {
      try {
        const path = Android.readLocalPath(item.id);
        if (path) {
          item.local = path;
          // Creamos blobUrl cargando con fetch al file://
          // (Esto solo funciona con AllowUniversalAccessFromFileURLs)
          fetch('file://' + path)
            .then(r => r.blob())
            .then(b => { item.blobUrl = URL.createObjectURL(b); })
            .catch(() => {});
        }
      } catch (e) {}
    }
  });
});

/* ============ INIT ============ */
updatePlBar();
renderPL();
loadYTAPI();
</script>

</body>
